<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- REQUIREMENT: The calculator needs a display to show numbers and results -->
    <!-- TODO: What information does the display need to show? -->
    <div class="container">
      <div class="row"></div>
      <output name="display">0</output>
      <div>
        <button class="clear">clear</button>
        <button value="/" class="operators">/</button>
      </div>
      <div class="row">
        <button value="7" class="number">7</button>
        <button value="8" class="number">8</button>
        <button value="9" class="number">9</button>
        <button value="*" class="operators">*</button>
      </div>
      <div class="row">
        <button value="4" class="number">4</button>
        <button value="5" class="number">5</button>
        <button value="6" class="number">6</button>
        <button value="-" class="operators">-</button>
      </div>
      <div class="row">
        <button value="1" class="number">1</button>
        <button value="2" class="number">2</button>
        <button value="3" class="number">3</button>
        <button value="+" class="operators">+</button>
      </div>
      <div class="row">
        <button value="+/-" id="plusminus">+/-</button>
        <button value="0" class="number">0</button>
        <button value="." class="number">.</button>
        <button value="=" class="equal">=</button>
      </div>
    </div>

    <!-- REQUIREMENT: Buttons for digits 0-9, operators (+, -, *, /), equals, and clear -->
    <!-- THINK: How will you organize the button layout in a grid? -->
    <!-- THINK: How will your JavaScript know which button was clicked? -->

    <script src="script.js"></script>
  </body>
</html>
